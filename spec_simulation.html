<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noise + Gaussian PSF with Controls</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="pad-for-header">
<div class="simulation-title">Simulated Long-Slit Spectrograph (WIP)</div>
<div style="display: flex; flex-direction: column; align-items: center; margin-top: 40px;">
  <div style="position: relative;">
    <canvas id="exposureCanvas" width="500" height="250"></canvas>
  </div>
</div>

<div class="container my-4 d-flex flex-column align-items-center" id="all-controls">
  
  <!-- Checkbox group -->
  <div class="control-group card p-3 mb-4" style="width: 400px;" id="checkboxGroup">
    <h5 class="text-center mb-3">Simulation Options</h5>
    <div class="control"><label>Use Slit:</label> <input type="checkbox" id="useSlit"></div>
    <div class="control"><label>Use Prism:</label> <input type="checkbox" id="usePrism"></div>
    <div class="control"><label>Show Colors:</label> <input type="checkbox" id="showColors"></div>
    <div class="control"><label>Cosmic Rays:</label> <input type="checkbox" id="useCosmicRays"></div>
    <div class="control"><label>Helium Lamp:</label> <input type="checkbox" id="showHeliumLamp" disabled></div>
    <div class="control"><label>Hydrogen Lamp:</label> <input type="checkbox" id="showHydrogenLamp" disabled></div>
    <div class="control"><label>Show Clipped Pixels:</label> <input type="checkbox" id="useClipping"></div>
  </div>

  <!-- Physical parameters -->
  <div class="control-group card p-3 mb-4" style="width: 400px;" id="physicalParamGroup">
    <h5 class="text-center mb-3">Physical Sliders</h5>
    <div class="control"><label>Airmass:</label> <input type="range" id="airmassSlider" min="1" max="2" step="0.01" value="1"> <span id="airmassVal">1</span></div>
    <div class="control"><label>Seeing ("):</label> <input type="range" id="seeingSlider" min="0.1" max="20" step="0.1" value="3"> <span id="seeingVal">3</span></div>
    <div class="control"><label>Stellar Temperature (K):</label> <input type="range" id="tempSlider" min="1000" max="10000" step="100" value="5000"> <span id="tempVal">5000</span></div>
  </div>

  <!-- Telescope parameters -->
  <div class="control-group card p-3 mb-4" style="width: 400px;" id="telescopeParamGroup">
    <h5 class="text-center mb-3">Telescope Sliders</h5>
    <div class="control"><label>Slit Size ("):</label> <input type="range" id="slitSlider" min="2" max="20" step="0.1" value="5"> <span id="slitVal">5</span></div>
    <div class="control"><label>Saturation (ADU):</label> <input type="range" id="satSlider" min="1" max="100000" step="10" value="70000"> <span id="satVal">70000</span></div>
    <div class="control"><label>Exposure Time (s):</label> <input type="range" id="expSlider" min="0.1" max="60" step="0.1" value="3"> <span id="expVal">3</span></div>
    <div class="control"><label>Telescope Altitude (m):</label> <input type="range" id="altSlider" min="0" max="80000" step="10" value="1000"> <span id="altVal">1000</span></div>
    <div class="control"><label>Telescope Diameter (m):</label> <input type="range" id="telSlider" min="0.1" max="10" step="0.1" value="4"> <span id="telVal">4</span></div>
  </div>

</div>
  <script src="misc_scripts/spec_simulation.js"></script>
</body>
</html>
